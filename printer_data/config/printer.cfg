#####################################
# AUX Cooling Fan – FAN5 (4-pin)
#####################################

[fan_generic aux_fan]
pin: PA6                    # FAN5 PWM pin
hardware_pwm: True
cycle_time: 0.00004         # 25kHz for 4-pin PC fans

kick_start_time: 0.5
off_below: 0.10
max_power: 1.0

# RPM feedback (optional but supported)
tachometer_pin: ^PC2
tachometer_ppr: 2
tachometer_poll_interval: 0.0015

