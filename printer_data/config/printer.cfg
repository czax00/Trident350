[controller_fan controller_fan1]
##	Case fan 1 - CNC_FAN0
pin: PF7
kick_start_time: 0.5
max_power: 1.0
stepper: stepper_x
fan_speed: 0.6



[controller_fan controller_fan2]
##	Case fan 2 - CNC_FAN1
pin: PF9
max_power: 1.0
kick_start_time: 0.5
stepper: stepper_x
fan_speed: 0.6

[fan_generic Nevermore]
##	Controller fan - CNC_FAN2
pin: PF6
kick_start_time: 0.5
